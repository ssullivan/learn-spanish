<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Stress Detective · Me &amp; You</title>
<link rel="stylesheet" href="../shared/theme.css?v=bafd08d9">

</head>
<body>
<main class="page">
  <header class="page-header">
    <a class="back" href="./">← Unit 3</a>
    <p class="eyebrow">Unit 3 · Game</p>
    <h1>Stress Detective</h1>
    <p class="lede">Hear a sentence and tap the stressed syllable of one word: es<strong>tu</strong>diante, me<strong>xi</strong>cano.</p>
  </header>
  <div id="game"></div>
</main>
<script src="../shared/core.js?v=ca0e05f7"></script>
<script src="../shared/audio.js?v=eb4b9a31"></script>
<script src="../shared/game.js?v=abe7126e"></script>
<script src="../shared/stress.js?v=c370b85c"></script>
<!-- vocab: written by node tools/check.mjs --fix -->
<script src="../shared/spanish.js?v=a1a133ef"></script>
<script src="../shared/units.js?v=ddef226e"></script>
<script src="../words/words.js?v=528a7ac8"></script>
<script src="vocab.js?v=33e28567"></script>
<!-- /vocab -->
<script>
  const V = window.VOCAB;
  const questions = Stress.questionsIn(Core.entries(V));
  const isOneWord = question => Spanish.isOneWord(question.entry.spanish);
  Stress.init({
    root: document.getElementById('game'),
    key: 'u3-stress',
    levels: [
      { id: 'words', name: 'One word', blurb: 'Maestra, mexicano, también.', pool: questions.filter(isOneWord) },
      { id: 'phrases', name: 'In a phrase', blurb: 'Soy de México: find the stress of one word.', pool: questions.filter(question => !isOneWord(question)) },
      { id: 'all', name: 'Against the clock', blurb: 'Every word, eight seconds each.', pool: questions, rounds: 12, time: 8 },
    ],
  });
</script>
</body>
</html>
